name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:generate
      - run: npm run build
      - name: Prepare test database
        run: |
          for migration in drizzle/*.sql; do
            node node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --file "$migration"
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-build-and-checks
          include-hidden-files: true
          path: |
            dist/
            drizzle/
            artifacts/
            playwright-report/
            test-results/
